<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tiro Rápido — Ponto Eletrônico</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #F0EEE8;
    margin: 0;
    padding: 0;
    color: #222;
    min-height: 100vh;
  }
  header {
    background: #0A0A0A;
    color: #fff;
    padding: 16px 20px;
    text-align: center;
  }
  header h1 { font-size: 18px; margin: 0; font-style: italic; }
  header h1 span { color: #E2001A; }
  header .sub { font-size: 12px; color: #aaa; margin-top: 4px; }
  .container { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .card h2 { margin-top: 0; font-size: 17px; }
  .emp-btn {
    display: block;
    width: 100%;
    padding: 16px;
    margin-bottom: 10px;
    border: none;
    border-radius: 10px;
    background: #F0EEE8;
    font-size: 16px;
    font-weight: bold;
    color: #0A0A0A;
    cursor: pointer;
    text-align: left;
  }
  .emp-btn:active { background: #e2e0da; }
  .action-btn {
    display: block;
    width: 100%;
    padding: 18px;
    margin-bottom: 12px;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    color: #fff;
  }
  .action-btn.entrada { background: #1e7a46; }
  .action-btn.saida { background: #0A0A0A; }
  .action-btn.presenca { background: #1e7a46; }
  .action-btn.falta { background: #c0392b; }
  .action-btn:disabled { background: #ccc; cursor: not-allowed; }
  .back-link {
    display: inline-block;
    margin-bottom: 14px;
    color: #666;
    font-size: 14px;
    cursor: pointer;
    text-decoration: underline;
  }
  .status-box {
    background: #F0EEE8;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .status-box .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .status-box .row:last-child { margin-bottom: 0; }
  .status-ok { color: #1e7a46; font-weight: bold; }
  .status-pending { color: #999; }
  .status-falta { color: #c0392b; font-weight: bold; }
  .confirm {
    text-align: center;
    padding: 30px 10px;
  }
  .confirm .icon { font-size: 50px; margin-bottom: 10px; }
  .confirm h2 { margin: 0 0 6px; }
  .confirm p { color: #666; }
  .loading { text-align: center; padding: 60px 20px; color: #999; }
  .footer-link {
    text-align: center;
    margin-top: 30px;
    font-size: 12px;
    color: #aaa;
  }
  .footer-link a { color: #aaa; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #0A0A0A; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .nome-caps { text-transform: uppercase; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    font-family: Arial, sans-serif;
    margin-bottom: 10px;
  }
  label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-bottom: 4px; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #F0EEE8; font-size: 10px; text-transform: uppercase; color: #555; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: bold; color: #fff; }
  .badge.clt { background: #0A0A0A; }
  .badge.escala { background: #E2001A; }
  .badge.mei { background: #888; }
  .row-flex { display: flex; gap: 8px; }
  .row-flex > div { flex: 1; }
  button.secondary { background: #eee; color: #333; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  button.danger { background: #fdecea; color: #c0392b; }
</style>
</head>
<body>

<header>
  <h1>TIRO<span>O</span> RÁPIDO</h1>
  <div class="sub">Ponto Eletrônico</div>
</header>

<div class="container" id="app">
  <div class="loading">Carregando...</div>
</div>

<div class="toast" id="toast"></div>

<!-- ====================== FIREBASE ====================== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc,
  query, where, updateDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ============================================================
// CONFIGURAÇÃO DO FIREBASE — SUBSTITUA PELOS DADOS DO SEU PROJETO
// (Firebase Console → Configurações do Projeto → Seus apps → SDK)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyAbvkjWxMr1UKa6QwpXBKnsPJCG6kiU0C8",
  authDomain: "tirorapido-ponto.firebaseapp.com",
  projectId: "tirorapido-ponto",
  storageBucket: "tirorapido-ponto.firebasestorage.app",
  messagingSenderId: "133343595247",
  appId: "1:133343595247:web:eb480c1f71cabbada5a91a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const DIAS_SEMANA = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const GESTOR_PIN = "1234"; // troque para o PIN que preferir

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function nowTime() {
  const d = new Date();
  return d.toTimeString().slice(0,5);
}
function weekdayOfDate(iso) {
  return new Date(iso + 'T12:00:00').getDay();
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

let colaboradores = [];

async function carregarColaboradores() {
  const snap = await getDocs(collection(db, "colaboradores"));
  colaboradores = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function getRegistro(data, colaboradorId) {
  const ref = doc(db, "registros", `${data}_${colaboradorId}`);
  const snap = await getDoc(ref);
  return snap.exists() ? snap.data() : {};
}

async function salvarRegistro(data, colaboradorId, campos) {
  const ref = doc(db, "registros", `${data}_${colaboradorId}`);
  await setDoc(ref, { data, colaboradorId, ...campos }, { merge: true });
}

const UNIDADES_MEI = ["Buritis", "Pampulha"];

async function getRegistrosMEIDoDia(data, colaboradorId) {
  const resultado = {};
  for (const unidade of UNIDADES_MEI) {
    const ref = doc(db, "registros", `${data}_${colaboradorId}_${unidade}`);
    const snap = await getDoc(ref);
    resultado[unidade] = snap.exists() ? snap.data() : null;
  }
  return resultado;
}

async function salvarRegistroMEI(data, colaboradorId, unidade) {
  const ref = doc(db, "registros", `${data}_${colaboradorId}_${unidade}`);
  await setDoc(ref, { data, colaboradorId, unidade, hora: nowTime() }, { merge: true });
}

// ============================================================
// TELA: SELECIONAR COLABORADOR
// ============================================================
function telaSelecionarColaborador() {
  const app = document.getElementById('app');
  if (colaboradores.length === 0) {
    app.innerHTML = `
      <div class="card">
        <p style="text-align:center;color:#999;">Nenhum colaborador cadastrado ainda.</p>
        <button class="action-btn saida" onclick="window.__telaGestorPin()">Área do Gestor</button>
      </div>`;
    return;
  }
  app.innerHTML = `
    <div class="card">
      <h2>Quem é você?</h2>
      ${colaboradores.map(c => `
        <button class="emp-btn nome-caps" onclick="window.__selecionarColaborador('${c.id}')">${c.nome}</button>
      `).join('')}
    </div>
    <div class="footer-link"><a onclick="window.__telaGestorPin()">Área do Gestor</a></div>
  `;
}

// ============================================================
// TELA: AÇÃO DO COLABORADOR (após selecionar nome)
// ============================================================
async function telaAcaoColaborador(colaboradorId) {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="loading">Carregando...</div>`;

  const c = colaboradores.find(x => x.id === colaboradorId);
  const data = todayStr();
  const wd = weekdayOfDate(data);

  let html = `<div class="back-link" onclick="window.__voltarSelecao()">← Voltar</div>`;
  html += `<div class="card"><h2 class="nome-caps">${c.nome}</h2>`;

  if (c.regime === 'clt') {
    const reg = await getRegistro(data, colaboradorId);
    html += `
      <div class="status-box">
        <div class="row"><span>Modalidade</span> <span class="${reg.modalidade ? 'status-ok' : 'status-pending'}">${reg.modalidade ? (reg.modalidade === 'presencial' ? '🏢 Presencial' : '🏠 Home Office') : 'não escolhida'}</span></div>
        <div class="row"><span>Entrada</span> <span class="${reg.entrada ? 'status-ok' : 'status-pending'}">${reg.entrada || 'não registrada'}</span></div>
        <div class="row"><span>Saída almoço</span> <span class="${reg.saidaAlmoco ? 'status-ok' : 'status-pending'}">${reg.saidaAlmoco || 'não registrada'}</span></div>
        <div class="row"><span>Retorno almoço</span> <span class="${reg.retornoAlmoco ? 'status-ok' : 'status-pending'}">${reg.retornoAlmoco || 'não registrado'}</span></div>
        <div class="row"><span>Saída</span> <span class="${reg.saida ? 'status-ok' : 'status-pending'}">${reg.saida || 'não registrada'}</span></div>
      </div>
    `;
    if (!reg.modalidade) {
      html += `<button class="action-btn presenca" onclick="window.__registrarModalidade('${colaboradorId}','presencial')">🏢 Hoje é Presencial</button>`;
      html += `<button class="action-btn saida" onclick="window.__registrarModalidade('${colaboradorId}','home_office')">🏠 Hoje é Home Office</button>`;
    } else if (!reg.entrada) {
      html += `<button class="action-btn entrada" onclick="window.__registrarPonto('${colaboradorId}','entrada')">✅ Registrar Entrada</button>`;
    } else if (!reg.saidaAlmoco) {
      html += `<button class="action-btn saida" onclick="window.__registrarPonto('${colaboradorId}','saidaAlmoco')">🍽️ Registrar Saída para o Almoço</button>`;
    } else if (!reg.retornoAlmoco) {
      html += `<button class="action-btn entrada" onclick="window.__registrarPonto('${colaboradorId}','retornoAlmoco')">✅ Registrar Retorno do Almoço</button>`;
    } else if (!reg.saida) {
      html += `<button class="action-btn saida" onclick="window.__registrarPonto('${colaboradorId}','saida')">🚪 Registrar Saída</button>`;
    } else {
      html += `<p style="text-align:center;color:#1e7a46;font-weight:bold;">Ponto do dia já registrado!</p>`;
    }
  } else if (c.regime === 'escala') {
    const reg = await getRegistro(data, colaboradorId);
    const trabalhaHoje = (c.diasEscala || []).includes(wd);
    if (!trabalhaHoje) {
      html += `<p style="text-align:center;color:#999;">Você não está escalado(a) para hoje (${DIAS_SEMANA[wd]}).</p>`;
    } else if (reg.falta === true) {
      html += `<p style="text-align:center;color:#c0392b;font-weight:bold;">Falta já registrada para hoje.</p>`;
    } else if (reg.falta === false) {
      html += `<p style="text-align:center;color:#1e7a46;font-weight:bold;">Presença já confirmada hoje (${reg.modalidade === 'presencial' ? '🏢 Presencial' : '🏠 Home Office'})!</p>`;
    } else {
      html += `
        <button class="action-btn presenca" onclick="window.__registrarPresencaEscala('${colaboradorId}', false, 'presencial')">🏢 Presença Presencial</button>
        <button class="action-btn entrada" onclick="window.__registrarPresencaEscala('${colaboradorId}', false, 'home_office')">🏠 Presença Home Office</button>
        <button class="action-btn falta" onclick="window.__registrarPresencaEscala('${colaboradorId}', true, null)">❌ Registrar Falta</button>
      `;
    }
  } else {
    // MEI — presença por unidade (presencial), permite as duas no mesmo dia + plantão extra + home office
    const regs = await getRegistrosMEIDoDia(data, colaboradorId);
    const extraRef = doc(db, "registros", `${data}_${colaboradorId}_extra`);
    const extraSnap = await getDoc(extraRef);
    const plantaoExtra = extraSnap.exists() ? extraSnap.data() : null;
    const homeRef = doc(db, "registros", `${data}_${colaboradorId}_homeoffice`);
    const homeSnap = await getDoc(homeRef);
    const homeOffice = homeSnap.exists() ? homeSnap.data() : null;

    html += `
      <div class="status-box">
        ${UNIDADES_MEI.map(u => `
          <div class="row"><span>🏢 ${u} (presencial)</span> <span class="${regs[u] ? 'status-ok' : 'status-pending'}">${regs[u] ? 'Confirmado às ' + regs[u].hora : 'não registrado'}</span></div>
        `).join('')}
        <div class="row"><span>🏠 Home Office</span> <span class="${homeOffice ? 'status-ok' : 'status-pending'}">${homeOffice ? 'Confirmado às ' + homeOffice.hora : 'não registrado'}</span></div>
        <div class="row"><span>➕ Plantão extra</span> <span class="${plantaoExtra ? 'status-ok' : 'status-pending'}">${plantaoExtra ? 'Confirmado às ' + plantaoExtra.hora : 'não registrado'}</span></div>
      </div>
    `;
    UNIDADES_MEI.forEach(u => {
      if (!regs[u]) {
        html += `<button class="action-btn presenca" onclick="window.__registrarUnidadeMEI('${colaboradorId}','${u}')">🏢 Confirmar presença — ${u}</button>`;
      }
    });
    if (!homeOffice) {
      html += `<button class="action-btn entrada" onclick="window.__registrarHomeOfficeMEI('${colaboradorId}')">🏠 Registrar Home Office</button>`;
    }
    if (regs.Buritis && regs.Pampulha) {
      html += `<p style="text-align:center;color:#E2001A;font-weight:bold;margin-top:10px;">🔥 Dia com atendimento nas 2 unidades — plantão e passagem extra!</p>`;
    }
    if (!plantaoExtra) {
      html += `<button class="action-btn falta" style="background:#E2001A;margin-top:10px;" onclick="window.__registrarPlantaoExtra('${colaboradorId}')">➕ Registrar Plantão Extra</button>`;
    } else {
      html += `<p style="text-align:center;color:#E2001A;font-weight:bold;margin-top:10px;">➕ Plantão extra já registrado hoje!</p>`;
    }
  }

  html += `</div>`;
  app.innerHTML = html;
}

window.__selecionarColaborador = (id) => telaAcaoColaborador(id);
window.__voltarSelecao = () => telaSelecionarColaborador();

const LABELS_PONTO = {
  entrada: 'Entrada',
  saidaAlmoco: 'Saída para o almoço',
  retornoAlmoco: 'Retorno do almoço',
  saida: 'Saída',
};

window.__registrarPonto = async (colaboradorId, campo) => {
  const data = todayStr();
  const hora = nowTime();
  await salvarRegistro(data, colaboradorId, { [campo]: hora });
  toast(`${LABELS_PONTO[campo] || campo} registrada às ${hora}!`);
  telaAcaoColaborador(colaboradorId);
};

window.__registrarModalidade = async (colaboradorId, modalidade) => {
  const data = todayStr();
  await salvarRegistro(data, colaboradorId, { modalidade });
  toast(modalidade === 'presencial' ? '🏢 Modalidade: Presencial' : '🏠 Modalidade: Home Office');
  telaAcaoColaborador(colaboradorId);
};

window.__registrarPresencaEscala = async (colaboradorId, falta, modalidade) => {
  const data = todayStr();
  const campos = { falta };
  if (!falta && modalidade) campos.modalidade = modalidade;
  await salvarRegistro(data, colaboradorId, campos);
  toast(falta ? 'Falta registrada.' : (modalidade === 'presencial' ? '🏢 Presença presencial confirmada!' : '🏠 Presença home office confirmada!'));
  telaAcaoColaborador(colaboradorId);
};

window.__registrarUnidadeMEI = async (colaboradorId, unidade) => {
  const data = todayStr();
  await salvarRegistroMEI(data, colaboradorId, unidade);
  toast(`Presença confirmada em ${unidade}!`);
  telaAcaoColaborador(colaboradorId);
};

window.__registrarHomeOfficeMEI = async (colaboradorId) => {
  const data = todayStr();
  const ref = doc(db, "registros", `${data}_${colaboradorId}_homeoffice`);
  await setDoc(ref, { data, colaboradorId, tipo: 'home_office', hora: nowTime() }, { merge: true });
  toast('🏠 Home Office registrado!');
  telaAcaoColaborador(colaboradorId);
};

window.__registrarPlantaoExtra = async (colaboradorId) => {
  const data = todayStr();
  const ref = doc(db, "registros", `${data}_${colaboradorId}_extra`);
  await setDoc(ref, { data, colaboradorId, tipo: 'plantao_extra', hora: nowTime() }, { merge: true });
  toast('Plantão extra registrado!');
  telaAcaoColaborador(colaboradorId);
};

// ============================================================
// ÁREA DO GESTOR (protegida por PIN simples)
// ============================================================
window.__telaGestorPin = () => {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="back-link" onclick="window.__voltarSelecao()">← Voltar</div>
    <div class="card">
      <h2>Área do Gestor</h2>
      <label>PIN de acesso</label>
      <input type="password" id="pinInput" inputmode="numeric" maxlength="4" placeholder="****">
      <button class="action-btn saida" onclick="window.__validarPin()">Entrar</button>
    </div>
  `;
};

window.__validarPin = () => {
  const pin = document.getElementById('pinInput').value;
  if (pin === GESTOR_PIN) {
    telaGestorPainel();
  } else {
    toast('PIN incorreto.');
  }
};

async function telaGestorPainel() {
  editandoColaboradorId = null;
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="back-link" onclick="window.__voltarSelecao()">← Sair da área do gestor</div>
    <div class="card">
      <h2>Cadastrar colaborador</h2>
      <label>Nome</label>
      <input id="gNome" type="text" placeholder="Nome completo">
      <label>Regime</label>
      <select id="gRegime" onchange="window.__atualizarExtraRegime()">
        <option value="clt">CLT (entrada/saída)</option>
        <option value="escala">Escala (dias fixos)</option>
        <option value="mei">MEI (presença/falta)</option>
      </select>
      <div id="gExtra"></div>
      <button class="action-btn entrada" onclick="window.__salvarColaborador()">+ Adicionar</button>
    </div>
    <div class="card">
      <h2>Colaboradores (${colaboradores.length})</h2>
      <div id="gLista"></div>
    </div>
    <div class="card">
      <h2>Registrar ocorrência</h2>
      <p style="font-size:12px;color:#666;margin-top:0;">Atestado, falta justificada, folga concedida ou troca — não conta como falta comum no relatório.</p>
      <label>Colaborador</label>
      <select id="oColaborador">
        ${colaboradores.map(c => `<option value="${c.id}" style="text-transform:uppercase;">${c.nome}</option>`).join('')}
      </select>
      <label>Data</label>
      <input type="date" id="oData" value="${todayStr()}">
      <label>Tipo de ocorrência</label>
      <select id="oTipo">
        <option value="atestado">Atestado médico</option>
        <option value="falta_justificada">Não compareceu</option>
        <option value="folga">Folga concedida</option>
        <option value="troca">Troca de plantão</option>
      </select>
      <label>Observação (opcional)</label>
      <input id="oObs" type="text" placeholder="Ex: troca com Fulano no dia 15">
      <button class="action-btn entrada" onclick="window.__salvarOcorrencia()">+ Registrar ocorrência</button>
    </div>
    <div class="card">
      <h2>Ocorrências registradas</h2>
      <label>Mês</label>
      <input type="month" id="oMes" value="${todayStr().slice(0,7)}" onchange="window.__listarOcorrencias()">
      <div id="gOcorrencias"></div>
    </div>
    <div class="card">
      <h2>Relatório mensal</h2>
      <label>Mês</label>
      <input type="month" id="gMes" value="${todayStr().slice(0,7)}" onchange="window.__gerarRelatorio()">
      <button class="secondary" style="margin-top:10px;" onclick="window.__exportarRelatorioCSV()">⬇️ Baixar relatório (Excel/CSV)</button>
      <div id="gRelatorio"></div>
    </div>
  `;
  window.__atualizarExtraRegime();
  renderListaGestor();
  window.__gerarRelatorio();
  window.__listarOcorrencias();
}

const TIPOS_OCORRENCIA = {
  atestado: { label: "Atestado médico", cor: "#0A0A0A" },
  falta_justificada: { label: "Não compareceu", cor: "#6B6B6B" },
  folga: { label: "Folga concedida", cor: "#1e7a46" },
  troca: { label: "Troca de plantão", cor: "#E2001A" },
};

window.__salvarOcorrencia = async () => {
  const colaboradorId = document.getElementById('oColaborador').value;
  const data = document.getElementById('oData').value;
  const tipo = document.getElementById('oTipo').value;
  const observacao = document.getElementById('oObs').value.trim();
  if (!colaboradorId || !data) { toast('Selecione o colaborador e a data.'); return; }

  const ref = doc(db, "ocorrencias", `${data}_${colaboradorId}`);
  await setDoc(ref, { data, colaboradorId, tipo, observacao }, { merge: true });
  toast('Ocorrência registrada!');
  document.getElementById('oObs').value = '';
  window.__listarOcorrencias();
  window.__gerarRelatorio();
};

window.__listarOcorrencias = async () => {
  const mes = document.getElementById('oMes').value;
  const div = document.getElementById('gOcorrencias');
  div.innerHTML = `<p style="color:#999;font-size:12px;">Carregando...</p>`;

  try {
    const snap = await getDocs(collection(db, "ocorrencias"));
    const ocorrencias = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(o => o.data && typeof o.data === 'string' && o.data.startsWith(mes))
      .sort((a, b) => a.data.localeCompare(b.data));

    if (ocorrencias.length === 0) {
      div.innerHTML = `<p style="color:#999;font-size:13px;">Nenhuma ocorrência neste mês.</p>`;
      return;
    }

    div.innerHTML = `
      <table>
        <tr><th>Data</th><th>Colaborador</th><th>Tipo</th><th>Obs.</th><th></th></tr>
        ${ocorrencias.map(o => {
          const colab = colaboradores.find(c => c.id === o.colaboradorId);
          const tipoInfo = TIPOS_OCORRENCIA[o.tipo] || { label: o.tipo || '(tipo não informado)', cor: '#666' };
          return `
            <tr>
              <td>${fmtDatePt(o.data)}</td>
              <td class="nome-caps">${colab ? colab.nome : '(colaborador removido)'}</td>
              <td><span class="badge" style="background:${tipoInfo.cor};">${tipoInfo.label}</span></td>
              <td style="font-size:11px;color:#666;">${o.observacao || '—'}</td>
              <td><button class="secondary danger" onclick="window.__removerOcorrencia('${o.id}')">Remover</button></td>
            </tr>`;
        }).join('')}
      </table>`;
  } catch (erro) {
    console.error('Erro ao carregar ocorrências:', erro);
    div.innerHTML = `<p style="color:#c0392b;font-size:12px;">Erro ao carregar ocorrências. Detalhe: ${erro.message || erro}</p>`;
  }
};

window.__removerOcorrencia = async (id) => {
  if (!confirm('Remover esta ocorrência?')) return;
  await deleteDoc(doc(db, "ocorrencias", id));
  toast('Ocorrência removida.');
  window.__listarOcorrencias();
  window.__gerarRelatorio();
};

window.__atualizarExtraRegime = () => {
  const regime = document.getElementById('gRegime').value;
  const extra = document.getElementById('gExtra');
  if (regime === 'clt') {
    extra.innerHTML = `
      <div class="row-flex">
        <div><label>Entrada padrão</label><input id="gEntrada" type="time" value="09:00"></div>
        <div><label>Saída padrão</label><input id="gSaida" type="time" value="18:00"></div>
      </div>`;
  } else if (regime === 'escala') {
    extra.innerHTML = `
      <label>Dias de trabalho</label>
      ${DIAS_SEMANA.map((d,i) => `
        <label style="display:flex;align-items:center;gap:6px;font-weight:normal;">
          <input type="checkbox" class="gDiaChk" value="${i}" style="width:auto;"> ${d}
        </label>
      `).join('')}`;
  } else {
    extra.innerHTML = `<p style="font-size:12px;color:#666;">Apenas presença/falta será registrada.</p>`;
  }
};

window.__salvarColaborador = async () => {
  const nome = document.getElementById('gNome').value.trim();
  const regime = document.getElementById('gRegime').value;
  if (!nome) { toast('Digite o nome.'); return; }

  const dadosColaborador = { nome, regime };
  if (regime === 'clt') {
    dadosColaborador.entradaPadrao = document.getElementById('gEntrada').value;
    dadosColaborador.saidaPadrao = document.getElementById('gSaida').value;
  }
  if (regime === 'escala') {
    dadosColaborador.diasEscala = Array.from(document.querySelectorAll('.gDiaChk:checked')).map(c => Number(c.value));
  }

  if (editandoColaboradorId) {
    await setDoc(doc(db, "colaboradores", editandoColaboradorId), dadosColaborador);
    toast('Colaborador atualizado!');
    editandoColaboradorId = null;
  } else {
    await addDoc(collection(db, "colaboradores"), dadosColaborador);
    toast('Colaborador cadastrado!');
  }
  await carregarColaboradores();
  telaGestorPainel();
};

function renderListaGestor() {
  const div = document.getElementById('gLista');
  if (colaboradores.length === 0) {
    div.innerHTML = `<p style="color:#999;font-size:13px;">Nenhum colaborador ainda.</p>`;
    return;
  }
  div.innerHTML = `
    <table>
      <tr><th>Nome</th><th>Regime</th><th></th></tr>
      ${colaboradores.map(c => `
        <tr>
          <td class="nome-caps">${c.nome}</td>
          <td><span class="badge ${c.regime}">${c.regime.toUpperCase()}</span></td>
          <td style="white-space:nowrap;">
            <button class="secondary" onclick="window.__editarColaborador('${c.id}')">Editar</button>
            <button class="secondary danger" onclick="window.__excluirColaborador('${c.id}')">Excluir</button>
          </td>
        </tr>
      `).join('')}

}

let editandoColaboradorId = null;

window.__editarColaborador = (id) => {
  const c = colaboradores.find(x => x.id === id);
  if (!c) return;
  editandoColaboradorId = id;

  document.getElementById('gNome').value = c.nome;
  document.getElementById('gRegime').value = c.regime;
  window.__atualizarExtraRegime();

  if (c.regime === 'clt') {
    document.getElementById('gEntrada').value = c.entradaPadrao || '09:00';
    document.getElementById('gSaida').value = c.saidaPadrao || '18:00';
  } else if (c.regime === 'escala') {
    (c.diasEscala || []).forEach(d => {
      const chk = document.querySelector(`.gDiaChk[value="${d}"]`);
      if (chk) chk.checked = true;
    });
  }

  const btn = document.querySelector('#gNome').closest('.card').querySelector('button.action-btn');
  btn.textContent = '💾 Salvar edição';
  document.querySelector('#gNome').closest('.card').scrollIntoView({ behavior: 'smooth' });
};

window.__excluirColaborador = async (id) => {
  const c = colaboradores.find(x => x.id === id);
  if (!confirm(`Excluir ${c ? c.nome : 'este colaborador'}? Os registros de ponto já feitos serão mantidos no histórico, mas ele não vai mais aparecer na lista de seleção.`)) return;
  await deleteDoc(doc(db, "colaboradores", id));
  toast('Colaborador excluído.');
  await carregarColaboradores();
  telaGestorPainel();
};

function calcularMinutos(inicio, fim) {
  if (!inicio || !fim) return 0;
  const [ih, im] = inicio.split(':').map(Number);
  const [fh, fm] = fim.split(':').map(Number);
  let minutos = (fh * 60 + fm) - (ih * 60 + im);
  if (minutos < 0) minutos += 24 * 60; // caso vire a virada da noite
  return minutos;
}

function calcularHoras(registro) {
  const { entrada, saida, saidaAlmoco, retornoAlmoco } = registro;
  if (!entrada || !saida) return 0;
  let minutosTotais = calcularMinutos(entrada, saida);
  // Desconta o intervalo de almoço, se ambos os horários foram registrados
  if (saidaAlmoco && retornoAlmoco) {
    minutosTotais -= calcularMinutos(saidaAlmoco, retornoAlmoco);
  }
  return Math.max(minutosTotais, 0) / 60;
}

function formatarHoras(horasDecimais) {
  const h = Math.floor(horasDecimais);
  const m = Math.round((horasDecimais - h) * 60);
  return `${h}h${m.toString().padStart(2,'0')}`;
}

let ultimoRelatorio = { mes: null, linhas: [] };

function gerarDetalheDias(c, doColab, ocorrDoColab) {
  const porData = {};
  const addInfo = (data, texto) => {
    if (!porData[data]) porData[data] = [];
    porData[data].push(texto);
  };

  if (c.regime === 'clt') {
    doColab.forEach(r => {
      if (r.falta === true) {
        addInfo(r.data, '❌ Falta');
      } else {
        const modal = r.modalidade === 'presencial' ? '🏢 Presencial' : (r.modalidade === 'home_office' ? '🏠 Home Office' : '');
        let horario = '';
        if (r.entrada && r.saida) {
          const almoco = (r.saidaAlmoco && r.retornoAlmoco) ? `, almoço ${r.saidaAlmoco}–${r.retornoAlmoco}` : '';
          horario = ` — ${r.entrada} às ${r.saida}${almoco} (${formatarHoras(calcularHoras(r))})`;
        } else if (r.entrada) {
          horario = ` — entrada ${r.entrada} (sem saída registrada)`;
        }
        if (modal || horario) addInfo(r.data, `${modal}${horario}`);
      }
    });
  } else if (c.regime === 'mei') {
    doColab.forEach(r => {
      if (r.unidade) addInfo(r.data, `🏢 ${r.unidade}`);
      if (r.tipo === 'plantao_extra') addInfo(r.data, '➕ Plantão extra');
      if (r.tipo === 'home_office') addInfo(r.data, '🏠 Home Office');
    });
  } else {
    doColab.forEach(r => {
      if (r.falta === true) {
        addInfo(r.data, '❌ Falta');
      } else if (r.falta === false) {
        addInfo(r.data, r.modalidade === 'presencial' ? '🏢 Presencial' : (r.modalidade === 'home_office' ? '🏠 Home Office' : '✅ Presença'));
      }
    });
  }

  ocorrDoColab.forEach(o => {
    const tipoInfo = TIPOS_OCORRENCIA[o.tipo] || { label: o.tipo };
    addInfo(o.data, `📋 ${tipoInfo.label}${o.observacao ? ' — ' + o.observacao : ''}`);
  });

  return Object.entries(porData)
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([data, itens]) => {
      const unidadesNoDia = itens.filter(i => i.startsWith('🏢')).length;
      const destaque = (c.regime === 'mei' && unidadesNoDia >= 2) ? ' — 🔥 DIA COM 2 UNIDADES' : '';
      return { data, descricao: itens.join('  +  ') + destaque };
    });
}

window.__gerarRelatorio = async () => {
  const mes = document.getElementById('gMes').value;
  const div = document.getElementById('gRelatorio');
  div.innerHTML = `<p style="color:#999;font-size:12px;">Calculando...</p>`;

  try {
  const regSnap = await getDocs(collection(db, "registros"));
  const registros = regSnap.docs.map(d => d.data()).filter(r => r.data && typeof r.data === 'string');

  const ocorrSnap = await getDocs(collection(db, "ocorrencias"));
  const ocorrencias = ocorrSnap.docs.map(d => d.data()).filter(o => o.data && typeof o.data === 'string');

  const linhas = colaboradores.map(c => {
    const doColab = registros.filter(r => r.colaboradorId === c.id && r.data.startsWith(mes));
    const ocorrDoColab = ocorrencias.filter(o => o.colaboradorId === c.id && o.data && typeof o.data === 'string' && o.data.startsWith(mes));
    const datasComOcorrencia = new Set(ocorrDoColab.map(o => o.data));
    const resumoOcorrencias = Object.entries(
      ocorrDoColab.reduce((acc, o) => { acc[o.tipo] = (acc[o.tipo] || 0) + 1; return acc; }, {})
    ).map(([tipo, qtd]) => `${(TIPOS_OCORRENCIA[tipo] || {label: tipo}).label}: ${qtd}`).join(' · ') || '—';

    if (c.regime === 'clt') {
      const diasPresenca = doColab.filter(r => r.entrada && r.falta !== true).length;
      // Faltas que NÃO têm ocorrência justificando naquele dia
      const faltas = doColab.filter(r => r.falta === true && !datasComOcorrencia.has(r.data)).length;
      const totalHoras = doColab.reduce((soma, r) => soma + calcularHoras(r), 0);
      const diasPresencial = doColab.filter(r => r.modalidade === 'presencial').length;
      const diasHomeOffice = doColab.filter(r => r.modalidade === 'home_office').length;
      return {
        nome: c.nome, regime: c.regime,
        presenca: `${diasPresenca} dias`,
        faltas: `${faltas} falta(s)`,
        faltasCor: faltas > 0 ? '#c0392b' : '#1e7a46',
        extra: formatarHoras(totalHoras),
        modalidade: `🏢 ${diasPresencial} · 🏠 ${diasHomeOffice}`,
        ocorrencias: resumoOcorrencias,
        detalheDias: gerarDetalheDias(c, doColab, ocorrDoColab),
      };
    } else if (c.regime === 'mei') {
      const porDia = {};
      doColab.filter(r => r.unidade).forEach(r => {
        if (!porDia[r.data]) porDia[r.data] = [];
        porDia[r.data].push(r.unidade);
      });
      const diasTrabalhados = Object.keys(porDia).length;
      const diasDuplaUnidade = Object.values(porDia).filter(u => u.length >= 2).length;
      const totalPassagens = Object.values(porDia).reduce((soma, u) => soma + u.length, 0);
      const plantoesExtras = doColab.filter(r => r.tipo === 'plantao_extra').length;
      const diasHomeOffice = doColab.filter(r => r.tipo === 'home_office').length;
      return {
        nome: c.nome, regime: c.regime,
        presenca: `${diasTrabalhados} dias`,
        faltas: `${diasDuplaUnidade} dia(s) com 2 unidades · ${plantoesExtras} plantão(ões) extra(s)`,
        faltasCor: (diasDuplaUnidade > 0 || plantoesExtras > 0) ? '#E2001A' : '#999',
        extra: `${totalPassagens} passagens`,
        modalidade: `🏢 ${diasTrabalhados} · 🏠 ${diasHomeOffice}`,
        ocorrencias: resumoOcorrencias,
        detalheDias: gerarDetalheDias(c, doColab, ocorrDoColab),
      };
    } else {
      // escala
      const diasPresenca = doColab.filter(r => r.falta === false).length;
      const faltas = doColab.filter(r => r.falta === true && !datasComOcorrencia.has(r.data)).length;
      const diasPresencial = doColab.filter(r => r.modalidade === 'presencial').length;
      const diasHomeOffice = doColab.filter(r => r.modalidade === 'home_office').length;
      return {
        nome: c.nome, regime: c.regime,
        presenca: `${diasPresenca} dias`,
        faltas: `${faltas} falta(s)`,
        faltasCor: faltas > 0 ? '#c0392b' : '#1e7a46',
        extra: '—',
        modalidade: `🏢 ${diasPresencial} · 🏠 ${diasHomeOffice}`,
        ocorrencias: resumoOcorrencias,
        detalheDias: gerarDetalheDias(c, doColab, ocorrDoColab),
      };
    }
  });

  ultimoRelatorio = { mes, linhas };

  div.innerHTML = `
    <table>
      <tr><th>Nome</th><th>Regime</th><th>Presença</th><th>Faltas/Alertas</th><th>Horas/Passagens</th><th>Presencial · Home Office</th><th>Ocorrências</th></tr>
      ${linhas.map(l => `
        <tr>
          <td class="nome-caps">${l.nome}</td>
          <td><span class="badge ${l.regime}">${l.regime.toUpperCase()}</span></td>
          <td style="color:#1e7a46;font-weight:bold;">${l.presenca}</td>
          <td style="color:${l.faltasCor};font-weight:bold;">${l.faltas}</td>
          <td>${l.extra}</td>
          <td style="font-size:11px;">${l.modalidade}</td>
          <td style="font-size:10px;color:#666;">${l.ocorrencias}</td>
        </tr>
      `).join('')}
    </table>

    <p style="font-size:11px;color:#888;margin-top:14px;margin-bottom:6px;">
      Resumo confuso? Abra o detalhamento dia a dia de cada colaborador abaixo 👇
    </p>

    ${linhas.map(l => `
      <details style="margin-bottom:6px;background:#F0EEE8;border-radius:8px;padding:8px 12px;">
        <summary class="nome-caps" style="cursor:pointer;font-weight:bold;font-size:13px;">
          ${l.nome} <span style="font-weight:normal;color:#888;font-size:11px;">— ${l.detalheDias.length} dia(s) com registro</span>
        </summary>
        ${l.detalheDias.length === 0
          ? `<p style="font-size:12px;color:#999;margin:8px 0 0;">Nenhum registro neste mês.</p>`
          : `<table style="margin-top:8px;">
              <tr><th>Data</th><th>O que aconteceu</th></tr>
              ${l.detalheDias.map(d => `
                <tr>
                  <td style="white-space:nowrap;">${fmtDatePt(d.data)}</td>
                  <td style="font-size:12px;">${d.descricao}</td>
                </tr>
              `).join('')}
            </table>`
        }
      </details>
    `).join('')}
  `;
  } catch (erro) {
    console.error('Erro ao gerar relatório:', erro);
    div.innerHTML = `<p style="color:#c0392b;font-size:12px;">Erro ao gerar relatório. Detalhe: ${erro.message || erro}</p>`;
  }
};

window.__exportarRelatorioCSV = () => {
  if (!ultimoRelatorio.linhas || ultimoRelatorio.linhas.length === 0) {
    toast('Gere o relatório do mês antes de baixar.');
    return;
  }

  const cabecalho = ['Nome', 'Regime', 'Presença', 'Faltas/Alertas', 'Horas/Passagens', 'Presencial · Home Office', 'Ocorrências'];
  const linhasCSV = ultimoRelatorio.linhas.map(l => [
    l.nome, l.regime.toUpperCase(), l.presenca, l.faltas, l.extra, l.modalidade, l.ocorrencias
  ]);

  const escapar = (valor) => `"${String(valor).replace(/"/g, '""')}"`;
  const conteudo = [cabecalho, ...linhasCSV]
    .map(linha => linha.map(escapar).join(';'))
    .join('\r\n');

  // BOM (\uFEFF) garante acentuação correta ao abrir no Excel
  const blob = new Blob(['\uFEFF' + conteudo], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `relatorio_ponto_${ultimoRelatorio.mes}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  toast('Relatório baixado!');
};
